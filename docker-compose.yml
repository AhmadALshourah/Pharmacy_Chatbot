services:
  chatbot:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # Persist the database and FAISS index between container restarts
      - ./pharmacy.db:/app/pharmacy.db
      - ./pharmacy.faiss:/app/pharmacy.faiss
      - ./pharmacy.faiss.meta:/app/pharmacy.faiss.meta
      - ./logs:/app/logs
    restart: unless-stopped
